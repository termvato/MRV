; =============================================================================
; platformio.ini — MRV Firmware build configuration
; Target : Teensy 4.0 (ARM Cortex-M7, 600 MHz)
; Framework: Arduino (via Teensyduino core)
; Library  : STM32duino LSM6DSV16X (official ST Arduino library)
; =============================================================================

[env:teensy40]
platform       = teensy
board          = teensy40
framework      = arduino

; ─── Library dependencies ────────────────────────────────────────────────────
lib_deps =
    stm32duino/STM32duino LSM6DSV16X
    paulstoffregen/Encoder          ; quadrature encoder decoding (Teensy-optimised)

; ─── Compiler flags ──────────────────────────────────────────────────────────
; -I src  : adds src/ to the include search path so every file can use
;           angle-bracket-style project includes like "config/config.h"
build_flags =
    -std=gnu++17
    -I src
    -Wall
    -Wextra

; ─── Upload and serial monitor ───────────────────────────────────────────────
upload_protocol = teensy-cli
monitor_speed   = 115200
